<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Rashid Ali Soomro — AI/ML Engineer, Computer Vision and Data" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0d1530"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6f7ff"/>
      <stop offset="0.55" stop-color="#7ee7ff"/>
      <stop offset="1" stop-color="#b69cff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1e2a4d" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="300" rx="18"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .scan{animation:scan 3.2s ease-in-out infinite}
      @keyframes scan{0%{transform:translateY(-120px)}100%{transform:translateY(300px)}}
      .box{stroke-dasharray:1500;stroke-dashoffset:1500;animation:draw 1.2s .6s ease-out forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .fade{opacity:0;animation:fade .5s ease-out forwards}
      .d1{animation-delay:1.6s}.d2{animation-delay:2.0s}.d3{animation-delay:2.4s}.d4{animation-delay:2.8s}
      @keyframes fade{to{opacity:1}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .node{animation:pulse 2.4s ease-in-out infinite}
      .n2{animation-delay:.4s}.n3{animation-delay:.8s}.n4{animation-delay:1.2s}.n5{animation-delay:1.6s}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)" opacity="0.6"/>

    <!-- tiny neural net, right side -->
    <g stroke="#2b3a6b" stroke-width="1.2">
      <line x1="840" y1="70" x2="900" y2="110"/><line x1="840" y1="70" x2="900" y2="170"/>
      <line x1="840" y1="150" x2="900" y2="110"/><line x1="840" y1="150" x2="900" y2="170"/>
      <line x1="840" y1="230" x2="900" y2="110"/><line x1="840" y1="230" x2="900" y2="170"/>
      <line x1="900" y1="110" x2="955" y2="140"/><line x1="900" y1="170" x2="955" y2="140"/>
    </g>
    <g fill="#22d3ee">
      <circle class="node" cx="840" cy="70" r="5"/>
      <circle class="node n2" cx="840" cy="150" r="5"/>
      <circle class="node n3" cx="840" cy="230" r="5"/>
      <circle class="node n4" cx="900" cy="110" r="5" fill="#a78bfa"/>
      <circle class="node n5" cx="900" cy="170" r="5" fill="#a78bfa"/>
      <circle class="node" cx="955" cy="140" r="6" fill="#f0abfc"/>
    </g>

    <!-- terminal line -->
    <text x="60" y="62" class="mono" font-size="15" fill="#5b6b99">$ python detect.py --source ./github-profile</text>

    <!-- name -->
    <text x="78" y="152" class="sans" font-size="58" font-weight="800" fill="url(#name)" letter-spacing="1">Rashid Ali Soomro</text>

    <!-- detection box around the name -->
    <rect class="box" x="62" y="96" width="600" height="78" rx="4" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <g class="fade d1">
      <rect x="62" y="74" width="154" height="24" fill="#22d3ee"/>
      <text x="71" y="91" class="mono" font-size="14" font-weight="700" fill="#06101f">ml_engineer  0.99</text>
      <!-- corner ticks -->
      <path d="M652 96h10v10M62 164v10h10M662 164v10h-10" fill="none" stroke="#67e8f9" stroke-width="3"/>
    </g>

    <!-- roles -->
    <text x="64" y="214" class="mono" font-size="17" fill="#c7d2fe">
      <tspan class="fade d2">Computer Vision</tspan><tspan class="fade d2" fill="#4c5a8a">  ·  </tspan><tspan class="fade d3">OCR &amp; Document AI</tspan><tspan class="fade d3" fill="#4c5a8a">  ·  </tspan><tspan class="fade d4">RAG &amp; LLM Apps</tspan><tspan class="fade d4" fill="#4c5a8a">  ·  </tspan><tspan class="fade d4">Data Automation</tspan>
    </text>

    <text x="64" y="254" class="mono" font-size="14" fill="#5b6b99">&gt; objects detected: 1 · status: open to freelance &amp; collaboration<tspan class="blink" fill="#22d3ee"> ▌</tspan></text>

    <!-- scan line -->
    <rect class="scan" x="0" y="0" width="1000" height="120" fill="url(#scan)" opacity="0.55"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#1f2b52"/>
</svg>
